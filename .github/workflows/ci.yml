name: CI

# Runs the quality gate on every pull request to main, and on pushes to any
# branch other than main (main pushes are handled by the deploy workflows).
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check the worker
        run: node --check worker/index.js

      - name: Build the frontend
        run: npm run build

      - name: Run tests
        run: npm test
